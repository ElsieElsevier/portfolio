# Builds the site and deploys it to S3 + CloudFront on every push to main.
# AWS access uses GitHub's OIDC token to assume an IAM role, so no AWS keys
# are stored in GitHub. The role ARN lives in the repo variable AWS_ROLE_ARN.
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  id-token: write # needed to request the OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: jin-bai-portfolio-site
  CLOUDFRONT_DISTRIBUTION_ID: EQLLS2SLZ653L

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed files in assets/ never change, so browsers can cache them for a year.
      - name: Upload assets
        run: >
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" --delete
          --cache-control "public, max-age=31536000, immutable"

      # Everything else (index.html, resume.pdf, images) is checked for updates on each visit.
      - name: Upload pages and files
        run: >
          aws s3 sync dist "s3://$S3_BUCKET" --delete
          --exclude "assets/*"
          --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/*"
